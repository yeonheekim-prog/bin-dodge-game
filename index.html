<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="쓰레기통 피하기">
<title>쓰레기통 피하기 — 등굣길 대작전</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { width:100%; height:100%; overflow:hidden; background:#6ab04c; touch-action:none;
    font-family:-apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; overscroll-behavior:none; }
  #game { display:block; width:100vw; height:100vh; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; background:rgba(20,40,20,0.55); backdrop-filter:blur(4px);
    color:#fff; padding:24px; z-index:10; }
  .overlay.hidden { display:none; }
  .title { font-size:32px; font-weight:800; text-shadow:0 3px 0 rgba(0,0,0,0.3); line-height:1.3; }
  .subtitle { font-size:16px; margin-top:10px; opacity:0.95; line-height:1.6; }
  .bigscore { font-size:48px; font-weight:800; margin:14px 0 2px; }
  .best { font-size:15px; opacity:0.9; margin-bottom:8px; }
  .btn { margin-top:20px; padding:15px 42px; font-size:20px; font-weight:700; color:#fff;
    background:linear-gradient(180deg,#ff9f43,#ee7b1c); border:none; border-radius:40px;
    box-shadow:0 5px 0 #c05f0a; cursor:pointer; }
  .btn:active { transform:translateY(3px); box-shadow:0 2px 0 #c05f0a; }
  .btn.green { background:linear-gradient(180deg,#2ecc71,#27ae60); box-shadow:0 5px 0 #1e8449; }
  .btn.green:active { box-shadow:0 2px 0 #1e8449; }
  .hint { margin-top:18px; font-size:13px; opacity:0.85; line-height:1.7; }
  .levels { display:flex; gap:10px; margin-top:18px; }
  .lv { padding:10px 14px; font-size:14px; font-weight:700; color:#fff; border-radius:14px;
    border:2px solid rgba(255,255,255,0.5); background:rgba(255,255,255,0.12); cursor:pointer; line-height:1.4; }
  .lv.sel { background:#ff9f43; border-color:#ffd8a8; }
  .lv.lock { opacity:0.45; }
  .small-btn { margin-top:26px; padding:9px 20px; font-size:13px; color:rgba(255,255,255,0.85);
    background:rgba(0,0,0,0.25); border:1px solid rgba(255,255,255,0.35); border-radius:20px; cursor:pointer; }
  .ver { position:fixed; bottom:calc(8px + env(safe-area-inset-bottom)); right:12px; font-size:11px;
    color:rgba(255,255,255,0.65); z-index:11; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="startOverlay" class="overlay">
  <div class="title">🗑️ 쓰레기통 피하기</div>
  <div class="subtitle" id="startSubtitle">등굣길 대작전! 1km를 달려 학교까지 가자</div>
  <div class="levels">
    <button class="lv" id="lv0">레벨 1<br>등굣길</button>
    <button class="lv" id="lv1">레벨 2<br>학교 안</button>
    <button class="lv" id="lv2">레벨 3<br>하교길</button>
  </div>
  <button class="btn" id="startBtn">레벨 1 시작</button>
  <div class="hint">👈 화면 왼쪽 탭 / 오른쪽 탭 👉 으로 피하세요<br>⚠️ 경고가 뜨면 위에서 뭔가 날아와요!</div>
  <button class="small-btn" id="resetBtn">🗑 기록 초기화</button>
</div>

<div id="clearOverlay" class="overlay hidden">
  <div class="title" id="clearTitle">레벨 1 클리어! 🎉</div>
  <div class="subtitle" id="clearMsg">학교 도착!</div>
  <button class="btn green" id="nextBtn">레벨 2 시작</button>
  <button class="small-btn" id="clearHomeBtn">레벨 선택으로</button>
</div>

<div id="overOverlay" class="overlay hidden">
  <div class="title" id="overTitle">아이쿠! 🗑️💥</div>
  <div class="bigscore" id="finalScore">0m</div>
  <div class="best" id="bestLine">최고 기록: 0m</div>
  <button class="btn" id="retryBtn">다시 달리기</button>
  <div class="hint" id="overHint">내일도 학교는 가야 하니까!</div>
  <button class="small-btn" id="homeBtn">레벨 선택으로</button>
</div>

<div class="ver">버전 3</div>

<script>
(function(){
  'use strict';
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth || 390; H = window.innerHeight || 844;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    layout();
  }

  // ----- 레이아웃 -----
  var LANES = 3, roadW, laneW, roadL, playerY, unit, vh;
  function layout(){
    roadW = W * 0.78;
    laneW = roadW / LANES;
    roadL = (W - roadW) / 2;
    playerY = H * 0.80;
    unit = Math.min(W / 400, H / 700);
    vh = unit * 866; // 가상 세로 기준: 화면 비율이 달라도 난이도 동일
  }
  function laneX(i){ return roadL + laneW * (i + 0.5); }

  // ----- 레벨 정의 -----
  var GOAL = 1000; // 1km
  var LEVELS = [
    { name:'등굣길', clearMsg:'학교 도착! 🏫', warnIcon:'🐦‍⬛', swoopMult:1.9, speedBase:0.50,
      obstDie:'아이쿠! 🗑️💥', swoopDie:'까치의 급습! 🐦⚡', hint:'내일도 학교는 가야 하니까!' },
    { name:'학교 안', clearMsg:'수업 끝! 🔔', warnIcon:'✈️', swoopMult:1.8, speedBase:0.53,
      obstDie:'으악! 바퀴벌레다! 🪳', swoopDie:'종이비행기 명중! ✈️💥', hint:'복도에서 뛰면 안 되는데!' },
    { name:'하교길', clearMsg:'집 도착! 🏠', warnIcon:'🚲', swoopMult:2.1, speedBase:0.56,
      obstDie:'캥거루랑 꽝! 🦘💥', swoopDie:'자전거랑 꽝! 🚲💥', hint:'집이 코앞이었는데!' }
  ];

  // ----- 저장 -----
  var UNLOCK_KEY = 'bin-dodge-unlock-v1';
  var BEST_KEY = 'bin-dodge-best-v2';
  var CLEAR_KEY = 'bin-dodge-allclear-v1';
  function loadUnlocked(){
    var v = parseInt(localStorage.getItem(UNLOCK_KEY) || '1', 10);
    return Math.min(Math.max(v || 1, 1), 3);
  }
  function loadBests(){
    try {
      var b = JSON.parse(localStorage.getItem(BEST_KEY) || '{}');
      if (!b['1']) {
        var old = parseInt(localStorage.getItem('bin-dodge-best-v1') || '0', 10);
        if (old > 0) b['1'] = old;
      }
      return b;
    } catch(e){ return {}; }
  }
  var unlocked = loadUnlocked();
  var bests = loadBests();
  var allClear = localStorage.getItem(CLEAR_KEY) === '1';

  // ----- 게임 상태 -----
  var state = 'start'; // start | play | clear | over
  var level = Math.min(unlocked, 3) - 1; // 0-based
  var player, obstacles, decos, dist, speed, spawnIn, runPhase, shakeT, anim;
  var swoopers, swoopWarn, swoopTimer, killedBy;

  function reset(){
    player = { lane:1, x: laneX(1) };
    obstacles = [];
    decos = [];
    swoopers = [];
    swoopWarn = null;
    swoopTimer = 6;
    killedBy = null;
    dist = 0;
    speed = vh * LEVELS[level].speedBase;
    spawnIn = vh * 0.5;
    runPhase = 0;
    anim = 0;
    shakeT = 0;
    for (var i = 0; i < 6; i++) spawnDeco(Math.random() * H);
  }

  // ----- 장식 -----
  function spawnDeco(y){
    var side = Math.random() < 0.5 ? 0 : 1;
    var colors = ['#e17055','#fdcb6e','#74b9ff','#a29bfe','#ff7675','#55efc4'];
    var type;
    if (level === 1) {
      type = ['locker','door','plant'][Math.floor(Math.random() * 3)];
    } else {
      type = Math.random() < 0.5 ? 'house' : 'tree';
    }
    decos.push({ side: side, type: type, y: y,
      color: colors[Math.floor(Math.random() * colors.length)] });
  }

  // ----- 바닥 장애물 생성 -----
  var LID_COLORS = ['#d63031','#fdcb6e','#00b894'];
  function spawnObstacles(){
    var difficulty = Math.min(dist / 2500, 1);
    var blockTwo = Math.random() < 0.35 + 0.5 * difficulty;
    var lanes = [0,1,2];
    for (var i = lanes.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = lanes[i]; lanes[i] = lanes[j]; lanes[j] = t;
    }
    var count = blockTwo ? 2 : 1;
    for (var k = 0; k < count; k++) {
      obstacles.push({
        lane: lanes[k], y: playerY - vh * 0.93,
        lid: LID_COLORS[Math.floor(Math.random() * LID_COLORS.length)],
        seed: Math.random() * 10,
        hit: false
      });
    }
  }

  // ----- 소리 -----
  var audioCtx = null;
  function initAudio(){
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }
  function beep(freq, dur, type, vol, slide){
    if (!audioCtx) return;
    try {
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(freq, audioCtx.currentTime);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, audioCtx.currentTime + dur);
      g.gain.setValueAtTime(vol || 0.08, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch(e){}
  }

  // ----- 조작 -----
  function move(dir){
    if (state !== 'play') return;
    var nl = player.lane + dir;
    if (nl < 0 || nl >= LANES) return;
    player.lane = nl;
    beep(500 + dir * 80, 0.06, 'triangle', 0.05);
  }
  canvas.addEventListener('touchstart', function(e){
    e.preventDefault();
    initAudio();
    if (state !== 'play') return;
    var x = e.changedTouches[0].clientX;
    move(x < W / 2 ? -1 : 1);
  }, { passive:false });
  canvas.addEventListener('mousedown', function(e){
    initAudio();
    if (state !== 'play') return;
    move(e.clientX < W / 2 ? -1 : 1);
  });
  window.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft') move(-1);
    if (e.key === 'ArrowRight') move(1);
  });

  // ----- 화면 전환 -----
  var startOverlay = document.getElementById('startOverlay');
  var clearOverlay = document.getElementById('clearOverlay');
  var overOverlay = document.getElementById('overOverlay');
  var lvBtns = [document.getElementById('lv0'), document.getElementById('lv1'), document.getElementById('lv2')];

  function refreshStartUI(){
    for (var i = 0; i < 3; i++) {
      var b = lvBtns[i];
      var locked = (i + 1) > unlocked;
      b.className = 'lv' + (i === level ? ' sel' : '') + (locked ? ' lock' : '');
      b.innerHTML = (locked ? '🔒 ' : '') + '레벨 ' + (i + 1) + '<br>' + LEVELS[i].name;
    }
    document.getElementById('startBtn').textContent = '레벨 ' + (level + 1) + ' 시작';
    var sub = '1km를 달려 통과하자! (' + LEVELS[level].name + ')';
    if (allClear) sub = '🎓 모든 레벨 클리어! 원하는 레벨을 다시 달려보자';
    document.getElementById('startSubtitle').textContent = sub;
  }
  function selectLevel(i){
    if ((i + 1) > unlocked) return;
    level = i;
    refreshStartUI();
  }
  lvBtns.forEach(function(b, i){ b.addEventListener('click', function(){ initAudio(); selectLevel(i); }); });

  function startGame(){
    initAudio();
    reset();
    state = 'play';
    startOverlay.classList.add('hidden');
    clearOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
    beep(660, 0.1, 'triangle', 0.06, 880);
  }
  function goHome(){
    state = 'start';
    reset();
    refreshStartUI();
    startOverlay.classList.remove('hidden');
    clearOverlay.classList.add('hidden');
    overOverlay.classList.add('hidden');
  }
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);
  document.getElementById('homeBtn').addEventListener('click', goHome);
  document.getElementById('clearHomeBtn').addEventListener('click', goHome);
  document.getElementById('nextBtn').addEventListener('click', function(){
    if (level < 2) level = level + 1;
    startGame();
  });
  document.getElementById('resetBtn').addEventListener('click', function(){
    if (!confirm('레벨과 최고 기록을 모두 초기화할까요?')) return;
    localStorage.removeItem(UNLOCK_KEY);
    localStorage.removeItem(BEST_KEY);
    localStorage.removeItem(CLEAR_KEY);
    localStorage.removeItem('bin-dodge-best-v1');
    unlocked = 1; bests = {}; allClear = false; level = 0;
    refreshStartUI();
  });

  function saveBest(m){
    var key = String(level + 1);
    var prev = bests[key] || 0;
    if (m > prev) { bests[key] = m; localStorage.setItem(BEST_KEY, JSON.stringify(bests)); return true; }
    return false;
  }

  function levelClear(){
    state = 'clear';
    saveBest(GOAL);
    if (level + 2 > unlocked) { unlocked = Math.min(level + 2, 3); localStorage.setItem(UNLOCK_KEY, String(unlocked)); }
    if (level === 2 && !allClear) { allClear = true; localStorage.setItem(CLEAR_KEY, '1'); }
    beep(660, 0.12, 'triangle', 0.08);
    setTimeout(function(){ beep(880, 0.12, 'triangle', 0.08); }, 130);
    setTimeout(function(){ beep(1100, 0.25, 'triangle', 0.08); }, 260);
    setTimeout(function(){
      document.getElementById('clearTitle').textContent = '레벨 ' + (level + 1) + ' 클리어! 🎉';
      var msg = LEVELS[level].clearMsg;
      if (level === 2) msg = '집 도착! 🏠 모든 레벨 클리어! 🎓';
      document.getElementById('clearMsg').textContent = msg;
      var nextBtn = document.getElementById('nextBtn');
      if (level < 2) { nextBtn.style.display = ''; nextBtn.textContent = '레벨 ' + (level + 2) + ' 시작'; }
      else { nextBtn.style.display = 'none'; }
      clearOverlay.classList.remove('hidden');
    }, 800);
  }

  function gameOver(){
    state = 'over';
    shakeT = 0.5;
    beep(300, 0.4, 'sawtooth', 0.1, 60);
    var m = Math.floor(dist);
    var isBest = saveBest(m);
    setTimeout(function(){
      var L = LEVELS[level];
      document.getElementById('finalScore').textContent = m + 'm / ' + GOAL + 'm';
      document.getElementById('bestLine').textContent = (isBest ? '🎉 신기록! ' : '') +
        '레벨 ' + (level + 1) + ' 최고 기록: ' + (bests[String(level + 1)] || 0) + 'm';
      document.getElementById('overTitle').textContent = killedBy === 'swoop' ? L.swoopDie : L.obstDie;
      document.getElementById('overHint').textContent = m >= GOAL * 0.7 ? '조금만 더 가면 되는데!' : L.hint;
      overOverlay.classList.remove('hidden');
    }, 600);
  }

  // ----- 업데이트 -----
  function update(dt){
    if (state !== 'play' && shakeT <= 0) return;
    if (shakeT > 0) shakeT -= dt;
    if (state !== 'play') return;

    var L = LEVELS[level];
    speed = vh * (L.speedBase + Math.min(dist / 3000, 1) * 0.36);
    var dy = speed * dt;
    dist += dy / (vh * 0.06); // 미터 환산
    if (dist >= GOAL) { dist = GOAL; levelClear(); return; }
    runPhase += dt * (8 + speed / H * 6);
    anim += dt;

    // 차선 이동 (부드럽게)
    var tx = laneX(player.lane);
    player.x += (tx - player.x) * Math.min(1, dt * 14);

    // 바닥 장애물 이동 + 충돌
    for (var i = obstacles.length - 1; i >= 0; i--) {
      var b = obstacles[i];
      b.y += dy;
      if (b.y > H + 150 * unit) { obstacles.splice(i, 1); continue; }
      // 충돌 판정: 위에서 다가올 때만 넓게, 지나간 것은 금방 안전
      var bw = laneW * 0.5, bh = 60 * unit;
      var px = player.x, ps = laneW * 0.28;
      var relY = b.y - playerY;
      if (!b.hit &&
          relY > -(bh * 0.7 + ps) && relY < bh * 0.4 &&
          Math.abs(laneX(b.lane) - px) < bw * 0.5 + ps * 0.6) {
        b.hit = true;
        killedBy = 'obst';
        gameOver();
      }
    }
    if (state !== 'play') return;

    // 생성 (급습 이벤트 중에는 새 줄이 안 나옴 — 협공 방지)
    var swoopActive = !!swoopWarn;
    for (i = 0; i < swoopers.length; i++) {
      if (swoopers[i].y < playerY + 60 * unit) { swoopActive = true; break; }
    }
    spawnIn -= dy;
    if (spawnIn <= 0 && !swoopActive) {
      spawnObstacles();
      var gap = vh * (0.36 - Math.min(dist / 3000, 1) * 0.08);
      spawnIn = gap + Math.random() * vh * 0.12;
    }

    // 급습 장애물 (60m부터). 근처에 장애물 2개 이상이면 잠시 미룸
    if (dist > 60 && !swoopWarn) {
      swoopTimer -= dt;
      var nearCount = 0;
      for (i = 0; i < obstacles.length; i++) {
        var ry = obstacles[i].y - playerY;
        if (ry > -vh * 0.5 && ry < 20 * unit) nearCount++;
      }
      if (swoopTimer <= 0 && nearCount < 2) {
        swoopWarn = { lane: player.lane, t: 1.1 };
        beep(1400, 0.12, 'square', 0.07);
        beep(1400, 0.12, 'square', 0.07, 1000);
      }
    }
    if (swoopWarn) {
      swoopWarn.t -= dt;
      if (swoopWarn.t <= 0) {
        swoopers.push({ lane: swoopWarn.lane, y: playerY - vh * 0.87, phase: 0 });
        swoopWarn = null;
        swoopTimer = 6 + Math.random() * 6;
        beep(900, 0.25, 'sawtooth', 0.05, 400);
      }
    }
    for (i = swoopers.length - 1; i >= 0; i--) {
      var sw = swoopers[i];
      sw.y += dy * L.swoopMult;
      sw.phase += dt * 22;
      if (sw.y > H + 100 * unit) { swoopers.splice(i, 1); continue; }
      var mrel = sw.y - playerY;
      if (mrel > -(30 * unit + laneW * 0.15) && mrel < 10 * unit &&
          Math.abs(laneX(sw.lane) - player.x) < laneW * 0.36) {
        killedBy = 'swoop';
        gameOver();
      }
    }

    // 장식 이동
    for (var d = decos.length - 1; d >= 0; d--) {
      decos[d].y += dy * 0.9;
      if (decos[d].y > H + 120 * unit) decos.splice(d, 1);
    }
    if (decos.length < 6 && Math.random() < 0.05) spawnDeco(-120 * unit);
  }

  // ----- 그리기 -----
  var THEMES = [
    { bg:'#6ab04c', road:'#b2bec3', kerb:'#95a5a6', line:'rgba(255,255,255,0.35)' },
    { bg:'#d7cdb4', road:'#e8ddc4', kerb:'#a99d80', line:'rgba(150,120,80,0.3)' },
    { bg:'#9aa54f', road:'#c4bcae', kerb:'#a89f8e', line:'rgba(255,250,230,0.4)' }
  ];

  function draw(){
    var T = THEMES[level];
    ctx.save();
    if (shakeT > 0) {
      ctx.translate((Math.random() - 0.5) * 12 * shakeT, (Math.random() - 0.5) * 12 * shakeT);
    }

    // 배경 (잔디/복도 벽)
    ctx.fillStyle = T.bg;
    ctx.fillRect(-20, -20, W + 40, H + 40);

    // 장식
    for (var d = 0; d < decos.length; d++) drawDeco(decos[d]);

    // 길 (인도/복도/보도)
    ctx.fillStyle = T.road;
    ctx.fillRect(roadL, -20, roadW, H + 40);
    ctx.fillStyle = T.kerb;
    ctx.fillRect(roadL - 6 * unit, -20, 6 * unit, H + 40);
    ctx.fillRect(roadL + roadW, -20, 6 * unit, H + 40);
    ctx.strokeStyle = T.line;
    ctx.lineWidth = 2;
    var off = (dist * vh * 0.06) % (H * 0.14);
    for (var y = -off; y < H + 40; y += H * 0.14) {
      ctx.beginPath(); ctx.moveTo(roadL, y); ctx.lineTo(roadL + roadW, y); ctx.stroke();
    }

    // 결승선 (1km 지점)
    var goalPx = (GOAL - dist) * vh * 0.06;
    if (state === 'play' && goalPx < H) {
      var gy = playerY - goalPx;
      var sq = 12 * unit;
      for (var c = 0; c < Math.ceil(roadW / sq); c++) {
        ctx.fillStyle = c % 2 === 0 ? '#2d3436' : '#ffffff';
        ctx.fillRect(roadL + c * sq, gy - sq, Math.min(sq, roadW - c * sq), sq);
        ctx.fillStyle = c % 2 === 0 ? '#ffffff' : '#2d3436';
        ctx.fillRect(roadL + c * sq, gy, Math.min(sq, roadW - c * sq), sq);
      }
      ctx.font = Math.floor(26 * unit) + 'px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🏁', W / 2, gy - 30 * unit);
    }

    // 바닥 장애물
    for (var i = 0; i < obstacles.length; i++) drawObstacle(obstacles[i]);

    // 주인공
    drawBoy(player.x, playerY);

    // 급습 장애물 (주인공 위로)
    for (var g = 0; g < swoopers.length; g++) drawSwooper(swoopers[g]);

    // 급습 경고
    if (swoopWarn) {
      var wx = laneX(swoopWarn.lane);
      ctx.globalAlpha = Math.sin(swoopWarn.t * 25) > 0 ? 0.95 : 0.4;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = Math.floor(36 * unit) + 'px sans-serif';
      ctx.fillText(LEVELS[level].warnIcon, wx, 52 * unit);
      ctx.font = Math.floor(30 * unit) + 'px sans-serif';
      ctx.fillText('⚠️', wx, 96 * unit);
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    // 점수판
    if (state !== 'start') {
      var m = Math.floor(dist);
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      roundRect(W / 2 - 90, 14, 180, 44, 22); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '700 20px -apple-system, sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('레벨' + (level + 1) + ' · ' + m + 'm', W / 2, 33);
      // 진행 바
      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      roundRect(W / 2 - 70, 46, 140, 6, 3); ctx.fill();
      ctx.fillStyle = '#ffd32a';
      roundRect(W / 2 - 70, 46, Math.max(6, 140 * Math.min(dist / GOAL, 1)), 6, 3); ctx.fill();
      var bl = bests[String(level + 1)] || 0;
      if (bl > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        ctx.font = '600 13px -apple-system, sans-serif';
        ctx.fillText('🏆 ' + bl + 'm', W / 2, 74);
      }
    }
  }

  function roundRect(x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function roundRectAt(x, y, w, h, r){ roundRect(x, y, w, h, r); }

  function drawDeco(d){
    var margin = (W - roadW) / 2;
    var cx = d.side === 0 ? margin * 0.5 : W - margin * 0.5;
    var u = unit;
    ctx.save();
    ctx.translate(cx, d.y);
    if (d.type === 'house') {
      var hw = Math.min(margin * 0.8, 70 * u), hh = hw * 0.7;
      ctx.fillStyle = d.color;
      ctx.fillRect(-hw / 2, -hh / 2, hw, hh);
      ctx.fillStyle = '#8d6e63';
      ctx.beginPath();
      ctx.moveTo(-hw / 2 - 5 * u, -hh / 2);
      ctx.lineTo(hw / 2 + 5 * u, -hh / 2);
      ctx.lineTo(0, -hh / 2 - hw * 0.4);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.8)';
      ctx.fillRect(-hw * 0.25, -hh * 0.2, hw * 0.2, hh * 0.3);
      ctx.fillRect(hw * 0.05, -hh * 0.2, hw * 0.2, hh * 0.3);
    } else if (d.type === 'tree') {
      var r = Math.min(margin * 0.35, 30 * u);
      ctx.fillStyle = '#795548';
      ctx.fillRect(-3 * u, 0, 6 * u, r * 1.2);
      ctx.fillStyle = level === 2 ? '#7c9c3f' : '#00875a';
      ctx.beginPath(); ctx.arc(0, -r * 0.3, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.5, r * 0.4, 0, Math.PI * 2); ctx.fill();
    } else if (d.type === 'locker') {
      var lw = Math.min(margin * 0.7, 50 * u), lh = lw * 1.6;
      ctx.fillStyle = d.color;
      ctx.fillRect(-lw / 2, -lh / 2, lw, lh);
      ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 2;
      ctx.strokeRect(-lw / 2, -lh / 2, lw, lh);
      ctx.beginPath(); ctx.moveTo(0, -lh / 2); ctx.lineTo(0, lh / 2); ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fillRect(-lw * 0.35, -lh * 0.3, lw * 0.2, 3 * u);
      ctx.fillRect(lw * 0.15, -lh * 0.3, lw * 0.2, 3 * u);
    } else if (d.type === 'door') {
      var dw = Math.min(margin * 0.65, 46 * u), dh = dw * 1.8;
      ctx.fillStyle = '#8d6e63';
      ctx.fillRect(-dw / 2, -dh / 2, dw, dh);
      ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 2;
      ctx.strokeRect(-dw / 2, -dh / 2, dw, dh);
      ctx.fillStyle = '#f6b93b';
      ctx.beginPath(); ctx.arc(dw * 0.28, 0, 3 * u, 0, Math.PI * 2); ctx.fill();
    } else { // plant
      var pr = Math.min(margin * 0.3, 22 * u);
      ctx.fillStyle = '#c0392b';
      ctx.fillRect(-pr * 0.5, 0, pr, pr * 0.8);
      ctx.fillStyle = '#27ae60';
      ctx.beginPath(); ctx.arc(0, -pr * 0.4, pr * 0.9, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  // ----- 바닥 장애물 그리기 -----
  function drawObstacle(b){
    if (level === 0) drawBin(b);
    else if (level === 1) drawRoach(b);
    else drawKangaroo(b);
  }

  // 호주식 바퀴 달린 쓰레기통
  function drawBin(b){
    var u = unit;
    var x = laneX(b.lane), y = b.y;
    var w = laneW * 0.52, h = 62 * u;
    ctx.save();
    ctx.translate(x, y);
    if (b.hit) ctx.rotate(0.5);
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(0, h * 0.5, w * 0.55, 8 * u, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2d3436';
    ctx.beginPath(); ctx.arc(-w * 0.3, h * 0.42, 7 * u, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(w * 0.3, h * 0.42, 7 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3d5c3f';
    ctx.beginPath();
    ctx.moveTo(-w * 0.5, -h * 0.35);
    ctx.lineTo(w * 0.5, -h * 0.35);
    ctx.lineTo(w * 0.38, h * 0.42);
    ctx.lineTo(-w * 0.38, h * 0.42);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-w * 0.18, -h * 0.3); ctx.lineTo(-w * 0.15, h * 0.38); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w * 0.18, -h * 0.3); ctx.lineTo(w * 0.15, h * 0.38); ctx.stroke();
    ctx.fillStyle = b.lid;
    roundRectAt(-w * 0.56, -h * 0.5, w * 1.12, h * 0.18, 5 * u); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    roundRectAt(-w * 0.15, -h * 0.56, w * 0.3, h * 0.08, 3 * u); ctx.fill();
    ctx.restore();
  }

  // 바퀴벌레
  function drawRoach(b){
    var u = unit;
    var wig = Math.sin(anim * 12 + b.seed * 7) * 3 * u;
    var x = laneX(b.lane) + wig, y = b.y;
    var w = laneW * 0.42, h = 52 * u;
    ctx.save();
    ctx.translate(x, y);
    if (b.hit) ctx.rotate(0.6);
    // 그림자
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath(); ctx.ellipse(0, h * 0.42, w * 0.55, 7 * u, 0, 0, Math.PI * 2); ctx.fill();
    // 다리 6개
    ctx.strokeStyle = '#3e2a15'; ctx.lineWidth = 2.5 * u; ctx.lineCap = 'round';
    for (var s = -1; s <= 1; s += 2) {
      for (var l = 0; l < 3; l++) {
        var ly = -h * 0.2 + l * h * 0.22;
        var kick = Math.sin(anim * 18 + l * 2 + b.seed) * 4 * u;
        ctx.beginPath();
        ctx.moveTo(s * w * 0.3, ly);
        ctx.lineTo(s * (w * 0.55 + Math.abs(kick)), ly + 8 * u + kick * 0.5);
        ctx.stroke();
      }
    }
    // 몸통 (등껍질)
    ctx.fillStyle = '#5d3a1a';
    ctx.beginPath(); ctx.ellipse(0, 0, w * 0.36, h * 0.42, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7b4a20';
    ctx.beginPath(); ctx.ellipse(0, -h * 0.05, w * 0.28, h * 0.32, 0, 0, Math.PI * 2); ctx.fill();
    // 날개 줄
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1.5 * u;
    ctx.beginPath(); ctx.moveTo(0, -h * 0.3); ctx.lineTo(0, h * 0.35); ctx.stroke();
    // 머리 (플레이어 쪽 = 아래)
    ctx.fillStyle = '#3e2a15';
    ctx.beginPath(); ctx.arc(0, h * 0.38, w * 0.16, 0, Math.PI * 2); ctx.fill();
    // 더듬이
    ctx.strokeStyle = '#3e2a15'; ctx.lineWidth = 1.8 * u;
    ctx.beginPath();
    ctx.moveTo(-w * 0.08, h * 0.44);
    ctx.quadraticCurveTo(-w * 0.35, h * 0.62 + wig, -w * 0.45, h * 0.78);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(w * 0.08, h * 0.44);
    ctx.quadraticCurveTo(w * 0.35, h * 0.62 - wig, w * 0.45, h * 0.78);
    ctx.stroke();
    ctx.restore();
  }

  // 캥거루 (앞모습, 콩콩 뜀)
  function drawKangaroo(b){
    var u = unit;
    var hop = -Math.abs(Math.sin(anim * 7 + b.seed * 5)) * 12 * u;
    var x = laneX(b.lane), y = b.y;
    var w = laneW * 0.5, h = 70 * u;
    ctx.save();
    ctx.translate(x, y);
    if (b.hit) ctx.rotate(0.4);
    // 그림자
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(0, h * 0.45, w * 0.5 + hop * 0.3, 7 * u, 0, 0, Math.PI * 2); ctx.fill();
    ctx.translate(0, hop);
    var fur = '#b0713a', furLight = '#d8935a';
    // 꼬리 (뒤로 살짝 보임)
    ctx.strokeStyle = fur; ctx.lineWidth = 7 * u; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(w * 0.25, h * 0.1); ctx.quadraticCurveTo(w * 0.6, h * 0.2, w * 0.65, h * 0.45); ctx.stroke();
    // 뒷발 (크게)
    ctx.fillStyle = furLight;
    ctx.beginPath(); ctx.ellipse(-w * 0.28, h * 0.38, 9 * u, 5 * u, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(w * 0.28, h * 0.38, 9 * u, 5 * u, 0.2, 0, Math.PI * 2); ctx.fill();
    // 몸통
    ctx.fillStyle = fur;
    ctx.beginPath(); ctx.ellipse(0, h * 0.05, w * 0.3, h * 0.32, 0, 0, Math.PI * 2); ctx.fill();
    // 배
    ctx.fillStyle = furLight;
    ctx.beginPath(); ctx.ellipse(0, h * 0.12, w * 0.18, h * 0.2, 0, 0, Math.PI * 2); ctx.fill();
    // 앞발
    ctx.strokeStyle = fur; ctx.lineWidth = 4.5 * u;
    ctx.beginPath(); ctx.moveTo(-w * 0.14, -h * 0.02); ctx.lineTo(-w * 0.2, h * 0.1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(w * 0.14, -h * 0.02); ctx.lineTo(w * 0.2, h * 0.1); ctx.stroke();
    // 머리
    ctx.fillStyle = fur;
    ctx.beginPath(); ctx.ellipse(0, -h * 0.32, w * 0.17, h * 0.14, 0, 0, Math.PI * 2); ctx.fill();
    // 주둥이
    ctx.fillStyle = furLight;
    ctx.beginPath(); ctx.ellipse(0, -h * 0.26, w * 0.09, h * 0.07, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4a2f17';
    ctx.beginPath(); ctx.arc(0, -h * 0.23, 2 * u, 0, Math.PI * 2); ctx.fill();
    // 귀
    ctx.fillStyle = fur;
    ctx.beginPath(); ctx.ellipse(-w * 0.13, -h * 0.46, 5 * u, 10 * u, -0.25, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(w * 0.13, -h * 0.46, 5 * u, 10 * u, 0.25, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = furLight;
    ctx.beginPath(); ctx.ellipse(-w * 0.13, -h * 0.45, 2.5 * u, 6 * u, -0.25, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(w * 0.13, -h * 0.45, 2.5 * u, 6 * u, 0.25, 0, Math.PI * 2); ctx.fill();
    // 눈
    ctx.fillStyle = '#2d3436';
    ctx.beginPath(); ctx.arc(-w * 0.07, -h * 0.34, 2 * u, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(w * 0.07, -h * 0.34, 2 * u, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ----- 급습 장애물 그리기 -----
  function drawSwooper(m){
    if (level === 0) drawMagpie(m);
    else if (level === 1) drawPlane(m);
    else drawBike(m);
  }

  // 호주 까치
  function drawMagpie(m){
    var u = unit, x = laneX(m.lane), y = m.y;
    var flap = Math.sin(m.phase);
    var wingY = -flap * 9 * u;
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = 'rgba(0,0,0,0.15)';
    ctx.beginPath();
    ctx.ellipse(0, 30 * u, 16 * u, 4 * u, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.moveTo(-4 * u, -2 * u);
    ctx.quadraticCurveTo(-18 * u, wingY - 7 * u, -28 * u, wingY);
    ctx.quadraticCurveTo(-16 * u, wingY + 8 * u, -4 * u, 5 * u);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(4 * u, -2 * u);
    ctx.quadraticCurveTo(18 * u, wingY - 7 * u, 28 * u, wingY);
    ctx.quadraticCurveTo(16 * u, wingY + 8 * u, 4 * u, 5 * u);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f1f2f6';
    ctx.beginPath();
    ctx.ellipse(-14 * u, wingY * 0.6, 6 * u, 3 * u, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.ellipse(14 * u, wingY * 0.6, 6 * u, 3 * u, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-3.5 * u, -22 * u, 7 * u, 12 * u);
    ctx.fillStyle = '#f1f2f6';
    ctx.fillRect(-3.5 * u, -22 * u, 7 * u, 4 * u);
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath();
    ctx.ellipse(0, 0, 7 * u, 13 * u, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f1f2f6';
    ctx.beginPath();
    ctx.ellipse(0, 5 * u, 5.5 * u, 5 * u, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(0, 14 * u, 5 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#b2bec3';
    ctx.beginPath();
    ctx.moveTo(-2 * u, 17 * u); ctx.lineTo(2 * u, 17 * u); ctx.lineTo(0, 24 * u);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath(); ctx.arc(-2.5 * u, 13 * u, 1.2 * u, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(2.5 * u, 13 * u, 1.2 * u, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // 종이비행기
  function drawPlane(m){
    var u = unit, x = laneX(m.lane), y = m.y;
    var bank = Math.sin(m.phase * 0.5) * 0.25;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(bank);
    // 그림자
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath();
    ctx.ellipse(0, 30 * u, 14 * u, 4 * u, 0, 0, Math.PI * 2); ctx.fill();
    // 날개 (앞이 아래 = 플레이어 쪽)
    ctx.fillStyle = '#f5f6fa';
    ctx.beginPath();
    ctx.moveTo(0, 20 * u);
    ctx.lineTo(-22 * u, -18 * u);
    ctx.lineTo(-3 * u, -12 * u);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#dfe4ea';
    ctx.beginPath();
    ctx.moveTo(0, 20 * u);
    ctx.lineTo(22 * u, -18 * u);
    ctx.lineTo(3 * u, -12 * u);
    ctx.closePath(); ctx.fill();
    // 가운데 접힌 몸통
    ctx.fillStyle = '#ced6e0';
    ctx.beginPath();
    ctx.moveTo(0, 20 * u);
    ctx.lineTo(-3 * u, -12 * u);
    ctx.lineTo(3 * u, -12 * u);
    ctx.closePath(); ctx.fill();
    // 선
    ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0, 20 * u); ctx.lineTo(0, -12 * u); ctx.stroke();
    ctx.restore();
  }

  // 자전거 (앞모습)
  function drawBike(m){
    var u = unit, x = laneX(m.lane), y = m.y;
    var wob = Math.sin(m.phase * 0.8) * 2 * u;
    ctx.save();
    ctx.translate(x + wob, y);
    // 그림자
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(0, 34 * u, 14 * u, 5 * u, 0, 0, Math.PI * 2); ctx.fill();
    // 앞바퀴
    ctx.fillStyle = '#2d3436';
    ctx.beginPath(); ctx.ellipse(0, 22 * u, 5 * u, 13 * u, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#636e72';
    ctx.beginPath(); ctx.ellipse(0, 22 * u, 2 * u, 9 * u, 0, 0, Math.PI * 2); ctx.fill();
    // 핸들바
    ctx.strokeStyle = '#2d3436'; ctx.lineWidth = 3.5 * u; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-14 * u, 2 * u); ctx.lineTo(14 * u, 2 * u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, 2 * u); ctx.lineTo(0, 12 * u); ctx.stroke();
    // 팔
    ctx.strokeStyle = '#f5c99b'; ctx.lineWidth = 4 * u;
    ctx.beginPath(); ctx.moveTo(-13 * u, 2 * u); ctx.lineTo(-10 * u, -10 * u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(13 * u, 2 * u); ctx.lineTo(10 * u, -10 * u); ctx.stroke();
    // 몸통 (형광 조끼)
    ctx.fillStyle = '#ffa801';
    roundRectAt(-11 * u, -22 * u, 22 * u, 16 * u, 6 * u); ctx.fill();
    ctx.strokeStyle = '#f5f6fa'; ctx.lineWidth = 2 * u;
    ctx.beginPath(); ctx.moveTo(-6 * u, -21 * u); ctx.lineTo(-6 * u, -7 * u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6 * u, -21 * u); ctx.lineTo(6 * u, -7 * u); ctx.stroke();
    // 머리 + 헬멧
    ctx.fillStyle = '#f5c99b';
    ctx.beginPath(); ctx.arc(0, -28 * u, 7 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e84118';
    ctx.beginPath(); ctx.arc(0, -30 * u, 7.5 * u, Math.PI, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.fillRect(-7.5 * u, -31 * u, 15 * u, 2 * u);
    ctx.restore();
  }

  // 호주 교복 입은 남자아이 (뒷모습, 달리기)
  function drawBoy(x, y){
    var u = unit;
    var leg = Math.sin(runPhase) * 10 * u;
    var arm = Math.sin(runPhase + Math.PI) * 8 * u;
    var bob = Math.abs(Math.sin(runPhase)) * 3 * u;
    var lean = (laneX(player.lane) - x) * 0.004;

    ctx.save();
    ctx.translate(x, y - bob);
    ctx.rotate(lean);

    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.beginPath();
    ctx.ellipse(0, 38 * u + bob, 22 * u, 6 * u, 0, 0, Math.PI * 2); ctx.fill();

    var skin = '#f5c99b';
    // 달리기 먼지
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.arc(-10 * u, 38 * u + bob, (2.5 + Math.abs(leg) * 0.15) * u, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(10 * u, 40 * u + bob, (2 + Math.abs(leg) * 0.12) * u, 0, Math.PI * 2); ctx.fill();
    // 다리
    ctx.strokeStyle = skin; ctx.lineWidth = 8 * u; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(-6 * u, 14 * u); ctx.lineTo(-7 * u, 32 * u + leg); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6 * u, 14 * u); ctx.lineTo(7 * u, 32 * u - leg); ctx.stroke();
    // 흰 양말
    ctx.strokeStyle = '#ffffff';
    ctx.beginPath(); ctx.moveTo(-6.8 * u, 26 * u + leg * 0.8); ctx.lineTo(-7 * u, 31 * u + leg); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6.8 * u, 26 * u - leg * 0.8); ctx.lineTo(7 * u, 31 * u - leg); ctx.stroke();
    // 신발
    ctx.fillStyle = '#2d3436';
    ctx.beginPath(); ctx.ellipse(-7 * u, 34 * u + leg, 6 * u, 4 * u, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(7 * u, 34 * u - leg, 6 * u, 4 * u, 0, 0, Math.PI * 2); ctx.fill();
    // 반바지
    ctx.fillStyle = '#1e3a5f';
    roundRectAt(-12 * u, 4 * u, 24 * u, 14 * u, 5 * u); ctx.fill();
    // 팔
    ctx.strokeStyle = skin; ctx.lineWidth = 7 * u;
    ctx.beginPath(); ctx.moveTo(-14 * u, -14 * u); ctx.lineTo(-17 * u, 2 * u + arm); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(14 * u, -14 * u); ctx.lineTo(17 * u, 2 * u - arm); ctx.stroke();
    // 셔츠
    ctx.fillStyle = '#7ec8e3';
    roundRectAt(-15 * u, -22 * u, 30 * u, 28 * u, 8 * u); ctx.fill();
    ctx.fillStyle = '#5ba8c9';
    ctx.beginPath();
    ctx.moveTo(-8 * u, -22 * u); ctx.lineTo(8 * u, -22 * u);
    ctx.lineTo(0, -15 * u); ctx.closePath(); ctx.fill();
    // 책가방
    ctx.fillStyle = '#d63031';
    roundRectAt(-11 * u, -20 * u, 22 * u, 22 * u, 6 * u); ctx.fill();
    ctx.fillStyle = '#a02525';
    roundRectAt(-8 * u, -14 * u, 16 * u, 10 * u, 4 * u); ctx.fill();
    ctx.strokeStyle = '#f6b93b'; ctx.lineWidth = 1.5 * u;
    ctx.beginPath(); ctx.moveTo(-8 * u, -16 * u); ctx.lineTo(8 * u, -16 * u); ctx.stroke();
    ctx.strokeStyle = '#a02525'; ctx.lineWidth = 3 * u;
    ctx.beginPath(); ctx.moveTo(-9 * u, -20 * u); ctx.lineTo(-12 * u, -8 * u); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(9 * u, -20 * u); ctx.lineTo(12 * u, -8 * u); ctx.stroke();
    // 코알라 열쇠고리
    var sway = Math.sin(runPhase * 0.9) * 3 * u;
    ctx.strokeStyle = '#636e72'; ctx.lineWidth = 1 * u;
    ctx.beginPath(); ctx.moveTo(11 * u, -6 * u); ctx.lineTo(13 * u + sway * 0.5, 0); ctx.stroke();
    ctx.fillStyle = '#95a5a6';
    ctx.beginPath(); ctx.arc(13 * u + sway, 3 * u, 3.5 * u, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(10.5 * u + sway, 0.5 * u, 1.6 * u, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(15.5 * u + sway, 0.5 * u, 1.6 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2d3436';
    ctx.beginPath(); ctx.ellipse(13 * u + sway, 3.5 * u, 1 * u, 1.4 * u, 0, 0, Math.PI * 2); ctx.fill();
    // 머리
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.arc(0, -32 * u, 11 * u, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6d4c2f';
    ctx.beginPath(); ctx.arc(0, -34 * u, 11 * u, Math.PI, Math.PI * 2); ctx.fill();
    ctx.fillRect(-11 * u, -34 * u, 22 * u, 5 * u);
    // 모자 (챙 넓은 남색 + 금색 띠)
    ctx.fillStyle = '#1e3a5f';
    ctx.beginPath();
    ctx.ellipse(0, -38 * u, 16 * u, 6 * u, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -40 * u, 9 * u, Math.PI, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f6b93b';
    ctx.fillRect(-9 * u, -42 * u, 18 * u, 3 * u);

    ctx.restore();
  }

  // ----- 메인 루프 -----
  var last = performance.now(), lastFrame = performance.now();
  function step(t){
    var dt = Math.min(Math.max((t - last) / 1000, 0), 0.05);
    last = t;
    lastFrame = performance.now();
    update(dt);
    draw();
  }
  function loop(t){
    step(t);
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  reset();
  refreshStartUI();
  requestAnimationFrame(loop);
  // 화면 갱신이 멈추는 환경 대비
  setInterval(function(){
    if (performance.now() - lastFrame > 200) step(performance.now());
  }, 100);

  // 100m 마다 딩동
  var lastMilestone = 0;
  setInterval(function(){
    if (state !== 'play') { lastMilestone = 0; return; }
    var m = Math.floor(dist / 100);
    if (m > lastMilestone) { lastMilestone = m; beep(880, 0.12, 'triangle', 0.06, 1320); }
  }, 300);
})();
</script>
</body>
</html>
